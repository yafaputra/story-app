<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="StoryMap - Bagikan cerita dan lokasi petualanganmu" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StoryMap" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>StoryMap - Bagikan Ceritamu</title>
</head>

<body>
    <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

    <div id="app">
        <header class="app-header" role="banner">
            <div class="header-inner">
                <a href="#/" class="brand" aria-label="StoryMap - Kembali ke beranda">
                    <span class="brand-icon" aria-hidden="true"><i class="fas fa-map-marker-alt"></i></span>
                    <span class="brand-name">StoryMap</span>
                </a>
                <nav class="main-nav" role="navigation" aria-label="Navigasi utama">
                    <ul role="list">
                        <li><a href="#/" class="nav-link" data-page="home">Beranda</a></li>
                        <li><a href="#/explore" class="nav-link" data-page="explore">Jelajahi</a></li>
                        <li><a href="#/favorites" class="nav-link" data-page="favorites">Favorit</a></li>
                        <li id="nav-add" class="hidden">
                            <a href="#/add" class="nav-link nav-add-btn" data-page="add">+ Cerita</a>
                        </li>
                        <li id="nav-auth">
                            <a href="#/login" class="nav-link nav-auth-btn" data-page="login">Masuk</a>
                        </li>
                    </ul>
                </nav>
                <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="Buka menu navigasi">
          <span></span><span></span><span></span>
        </button>
            </div>
            <div class="mobile-menu hidden" id="mobileMenu" role="navigation" aria-label="Menu navigasi mobile">
                <ul role="list">
                    <li>
                        <a href="#/" class="nav-link" data-page="home">
                            <i class="fas fa-home"></i> Beranda
                        </a>
                    </li>
                    <li>
                        <a href="#/explore" class="nav-link" data-page="explore">
                            <i class="fas fa-map-marked-alt"></i> Jelajahi
                        </a>
                    </li>
                    <li>
                        <a href="#/favorites" class="nav-link" data-page="favorites">
                            <i class="fas fa-heart"></i> Favorit
                        </a>
                    </li>
                    <li id="mobile-nav-add" class="hidden">
                        <a href="#/add" class="nav-link" data-page="add">
                            <i class="fas fa-plus"></i> Tambah Cerita
                        </a>
                    </li>
                    <li id="mobile-nav-auth">
                        <a href="#/login" class="nav-link" data-page="login">
                            <i class="fas fa-sign-in-alt"></i> Masuk
                        </a>
                    </li>
                </ul>
            </div>
        </header>

        <div id="statusBanner" class="status-banner hidden" role="status" aria-live="polite" aria-atomic="true"></div>

        <main id="main-content" tabindex="-1">
            <div id="page-container"></div>
        </main>
    </div>

    <div id="toast" class="toast hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <div id="installBanner" class="install-banner hidden" role="complementary" aria-label="Instal aplikasi StoryMap">
        <div class="install-content">
            <span class="install-icon" aria-hidden="true"><i class="fas fa-download"></i></span>
            <div class="install-text">
                <strong>Instal StoryMap</strong>
                <p>Akses lebih cepat dari layar utama</p>
            </div>
        </div>
        <div class="install-actions">
            <button id="installBtn" class="btn btn-primary btn-sm">Instal</button>
            <button id="dismissInstall" class="btn btn-ghost btn-sm" aria-label="Tutup banner instalasi">✕</button>
        </div>
    </div>

    <div id="notifToggle" class="notif-toggle hidden">
        <button id="togglePushBtn" class="btn-push" aria-pressed="false" aria-label="Toggle push notification">
      <span class="push-icon" aria-hidden="true"><i class="fas fa-bell"></i></span>
      <span class="push-label">Notifikasi</span>
    </button>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden" role="status" aria-live="polite" aria-label="Sedang memuat">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>Memuat...</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="src/app.js"></script>
</body>

</html>
